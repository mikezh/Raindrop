name: Sync Raindrop Bookmarks

on:
  # 手动触发
  workflow_dispatch:
  
  # 定时触发 - 每6小时同步一次
  schedule:
    - cron: '0 */6 * * *'
  
  # 推送到 main 分支时触发（可选）
  push:
    branches:
      - main
    paths:
      - 'scripts/**'
      - '.github/workflows/sync-raindrop.yml'

# 设置 GITHUB_TOKEN 的权限
permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests
      
      - name: Fetch and generate bookmarks site
        env:
          RAINDROP_API_TOKEN: ${{ secrets.RAINDROP_API_TOKEN }}
        run: |
          python scripts/fetch_raindrop.py --output docs
      
      - name: Generate CNAME (if custom domain)
        if: env.CUSTOM_DOMAIN != ''
        env:
          CUSTOM_DOMAIN: ${{ vars.CUSTOM_DOMAIN }}
        run: |
          echo "${{ vars.CUSTOM_DOMAIN }}" > docs/CNAME
      
      - name: Commit and push changes
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          
          # 添加所有更改
          git add docs/
          
          # 检查是否有更改
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "🔄 Sync bookmarks from Raindrop.io - $(date '+%Y-%m-%d %H:%M:%S')"
            git push
          fi
      
      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./docs
          publish_branch: gh-pages
          force_orphan: true
